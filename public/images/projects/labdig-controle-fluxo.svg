<title id="title">Laboratório Digital: controle e fluxo de dados</title><desc id="desc">Entradas chegam à unidade de controle, que habilita operações no fluxo de dados. Sinais de condição retornam ao controle. O fluxo produz saídas e registradores.</desc>
