<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">UART 7E1 · um caractere em dez bits</title><desc id="desc">Esquema documental do quadro UART 7E1: start, sete bits, paridade par e stop; não é medição.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#46748c"/></marker></defs><rect width="1200" height="720" fill="#f5f7f9"/><rect x="40" y="40" width="5" height="70" fill="#396782"/><g font-family="Arial, sans-serif" fill="#183142"><text x="65" y="70" font-size="29" font-weight="700">UART 7E1 · um caractere em dez bits</text><text x="65" y="105" font-size="17" fill="#526b7b">Diagrama fiel à tabela “Formato UART 7E1” da documentação</text><rect x="60" y="230" width="102" height="150" rx="6" fill="#e5eef5" stroke="#a4bdcc"/><text x="111" y="280" font-size="19" text-anchor="middle">Start</text><text x="111" y="338" font-size="28" text-anchor="middle">0</text><rect x="168" y="230" width="102" height="150" rx="6" fill="#fff" stroke="#a4bdcc"/><text x="219" y="280" font-size="19" text-anchor="middle">D0</text><text x="219" y="338" font-size="28" text-anchor="middle">d0</text><rect x="276" y="230" width="102" height="150" rx="6" fill="#fff" stroke="#a4bdcc"/><text x="327" y="280" font-size="19" text-anchor="middle">D1</text><text x="327" y="338" font-size="28" text-anchor="middle">d1</text><rect x="384" y="230" width="102" height="150" rx="6" fill="#fff" stroke="#a4bdcc"/><text x="435" y="280" font-size="19" text-anchor="middle">D2</text><text x="435" y="338" font-size="28" text-anchor="middle">d2</text><rect x="492" y="230" width="102" height="150" rx="6" fill="#fff" stroke="#a4bdcc"/><text x="543" y="280" font-size="19" text-anchor="middle">D3</text><text x="543" y="338" font-size="28" text-anchor="middle">d3</text><rect x="600" y="230" width="102" height="150" rx="6" fill="#fff" stroke="#a4bdcc"/><text x="651" y="280" font-size="19" text-anchor="middle">D4</text><text x="651" y="338" font-size="28" text-anchor="middle">d4</text><rect x="708" y="230" width="102" height="150" rx="6" fill="#fff" stroke="#a4bdcc"/><text x="759" y="280" font-size="19" text-anchor="middle">D5</text><text x="759" y="338" font-size="28" text-anchor="middle">d5</text><rect x="816" y="230" width="102" height="150" rx="6" fill="#fff" stroke="#a4bdcc"/><text x="867" y="280" font-size="19" text-anchor="middle">D6</text><text x="867" y="338" font-size="28" text-anchor="middle">d6</text><rect x="924" y="230" width="102" height="150" rx="6" fill="#e5eef5" stroke="#a4bdcc"/><text x="975" y="280" font-size="19" text-anchor="middle">Paridade</text><text x="975" y="338" font-size="28" text-anchor="middle">XOR</text><rect x="1032" y="230" width="102" height="150" rx="6" fill="#e5eef5" stroke="#a4bdcc"/><text x="1083" y="280" font-size="19" text-anchor="middle">Stop</text><text x="1083" y="338" font-size="28" text-anchor="middle">1</text><path d="M80 425H1110" fill="none" stroke="#46748c" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="475" font-size="22">Sete bits de dados: do menos significativo ao mais significativo.</text><text x="60" y="516" font-size="22">Paridade par: XOR dos sete dados. Stop: nível alto.</text><text x="60" y="567" font-size="17" fill="#526b7b">Esquema de campos, não uma forma de onda medida.</text><path d="M60 655H1140" stroke="#d3dfe5"/><text x="60" y="686" font-size="15" fill="#526b7b">LabDig · Poli-USP · Reprodução documental · fonte 7696cea · não é validação em hardware</text></g></svg>