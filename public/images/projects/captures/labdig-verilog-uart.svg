<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Verilog · composição do quadro serial</title><desc id="desc">Trecho literal de Verilog do transmissor UART 7E1, renderizado do código-fonte; não é captura de IDE.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#46748c"/></marker></defs><rect width="1200" height="720" fill="#f5f7f9"/><rect x="40" y="40" width="5" height="70" fill="#396782"/><g font-family="Arial, sans-serif" fill="#183142"><text x="65" y="70" font-size="29" font-weight="700">Verilog · composição do quadro serial</text><text x="65" y="105" font-size="17" fill="#526b7b">Trecho literal de tx_serial_7E1_fd.v · linhas 16–21</text><rect x="60" y="155" width="1080" height="430" rx="10" fill="#152b3a"/><text x="82" y="220" font-family="monospace" font-size="20" fill="#819cac">16</text><text x="135" y="220" xml:space="preserve" font-family="monospace" font-size="20" fill="#dcebf1">    // composicao dos dados seriais</text><text x="82" y="271" font-family="monospace" font-size="20" fill="#819cac">17</text><text x="135" y="271" xml:space="preserve" font-family="monospace" font-size="20" fill="#dcebf1">    assign s_dados[0]   = 1&#x27;b1;             // repouso</text><text x="82" y="322" font-family="monospace" font-size="20" fill="#819cac">18</text><text x="135" y="322" xml:space="preserve" font-family="monospace" font-size="20" fill="#dcebf1">    assign s_dados[1]   = 1&#x27;b0;             // start bit</text><text x="82" y="373" font-family="monospace" font-size="20" fill="#819cac">19</text><text x="135" y="373" xml:space="preserve" font-family="monospace" font-size="20" fill="#dcebf1">    assign s_dados[8:2] = dados_ascii[6:0]; // dado</text><text x="82" y="424" font-family="monospace" font-size="20" fill="#819cac">20</text><text x="135" y="424" xml:space="preserve" font-family="monospace" font-size="20" fill="#dcebf1">    assign s_dados[9]   = ^dados_ascii    ; // paridade</text><text x="82" y="475" font-family="monospace" font-size="20" fill="#819cac">21</text><text x="135" y="475" xml:space="preserve" font-family="monospace" font-size="20" fill="#dcebf1">    assign s_dados[10]  = 1&#x27;b1;             // stop bit 1</text><path d="M60 655H1140" stroke="#d3dfe5"/><text x="60" y="686" font-size="15" fill="#526b7b">LabDig · Poli-USP · Reprodução documental · fonte 7696cea · não é validação em hardware</text></g></svg>